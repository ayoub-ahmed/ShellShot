openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: models
    description: Model availability operations
  - name: prediction
    description: Image classification operations
  - name: evaluation
    description: Model evaluation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: healthCheckAlias
      tags: [health]
      summary: Health check
      description: Returns server health status at the public API health path.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List available classification models
      description: Returns the supported models and whether their trained weights are available.
      responses:
        "200":
          description: Supported model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
  /predict:
    post:
      operationId: predictImage
      tags: [prediction]
      summary: Classify a sea turtle image
      description: Runs an uploaded image through the selected TensorFlow/Keras model.
      parameters:
        - name: model
          in: query
          required: true
          schema:
            type: string
            enum: [mobilenet, resnet, efficientnet]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PredictionInput"
      responses:
        "200":
          description: Prediction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResult"
        "400":
          description: Invalid upload or model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Selected model is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /evaluation:
    get:
      operationId: getEvaluation
      tags: [evaluation]
      summary: Get configured model evaluation results
      description: Returns real evaluation data when it has been configured, otherwise an explicit unavailable state.
      responses:
        "200":
          description: Evaluation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ApiErrorDetail"
      required: [success, error]
    ModelInfo:
      type: object
      properties:
        id:
          type: string
          enum: [mobilenet, resnet, efficientnet]
        name:
          type: string
        architecture:
          type: string
        description:
          type: string
        available:
          type: boolean
      required: [id, name, architecture, description, available]
    ModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
      required: [models]
    PredictionInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]
    ProbabilityMap:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
    PredictionResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
        model:
          type: string
        modelId:
          type: string
        prediction:
          type: string
          enum: [Green Turtle, Leatherback Turtle, Loggerhead Turtle, Unknown]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          $ref: "#/components/schemas/ProbabilityMap"
        threshold:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [detected, unknown, low_confidence]
      required: [success, model, modelId, prediction, confidence, probabilities, threshold, status]
    EvaluationResponse:
      type: object
      properties:
        available:
          type: boolean
        message:
          type: string
        metrics:
          type: object
          additionalProperties: true
      required: [available, message]

